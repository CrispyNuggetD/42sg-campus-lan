name: Publish LAN42 guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r website/requirements.txt -r requirements-auth.txt
      - name: Prepare server release
        run: python tools/release.py
      - run: python -m unittest discover -s tests -p test_release.py
      - run: python -m unittest discover -s tests -p test_access_policy.py
      - run: python -m unittest discover -s tests -p test_access_migration.py
      - run: python -m unittest discover -s tests -p test_cluster_cache.py
      - run: python -m unittest discover -s tests -p test_guest_host_prompt.py
      - run: PYTHONPATH=tests python -m unittest test_auth test_announcements test_profile_lookup test_client test_network test_tracking test_mesh test_file_sharing test_koeldrop_live
      - run: python -m unittest discover -s tests -p test_shell_features.py
      - run: python -m unittest discover -s tests -p test_about.py
      - run: python website/build.py
      - run: python -m unittest discover -s tests -p test_website.py
      - name: Publish validated server version and immutable tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campus_lan/release.json CHANGELOG.md
          version=$(python -c 'from campus_lan import VERSION; print(VERSION)')
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$version"
          fi
          if ! git rev-parse "refs/tags/v$version" >/dev/null 2>&1; then
            git tag -a "v$version" -m "LAN42 server v$version"
          fi
          git push --atomic origin HEAD:main "refs/tags/v$version"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
